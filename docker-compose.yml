version: '3.8'

services:
  backend:
    build:
      context: ./backend
    image: backend:v2.0
    volumes:
      - backend-data:/app/data
    networks:
      - devops-net
    restart: always

  frontend:
    build:
      context: ./frontend
    image: frontend:v2.0
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - devops-net
    restart: always

networks:
  devops-net:
    driver: bridge

volumes:
  backend-data:
